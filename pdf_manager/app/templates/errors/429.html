{% extends "base.html" %}

{% block content %}
<div class="text-center py-5">
    <div class="mb-4">
        <i class="bi bi-hourglass-split text-warning" style="font-size: 5rem;"></i>
    </div>
    <h1 class="display-4 fw-bold">429</h1>
    <h2 class="mb-4">Zbyt wiele żądań</h2>
    <p class="lead text-muted mb-4">
        Przekroczono limit żądań. Proszę poczekać chwilę i spróbować ponownie.
    </p>
    {% if error and error.description %}
    <div class="alert alert-warning d-inline-block mb-4">
        <i class="bi bi-clock me-2"></i>
        Spróbuj ponownie za: <strong>{{ error.description }}</strong>
    </div>
    {% endif %}
    <div>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg">
            <i class="bi bi-house me-2"></i> Wróć do strony głównej
        </a>
        <button onclick="location.reload();" class="btn btn-outline-secondary btn-lg ms-2">
            <i class="bi bi-arrow-clockwise me-2"></i> Odśwież stronę
        </button>
    </div>
</div>
{% endblock %}
